name: path-guard
# Brakes from docs/factory.md: code reaches src/, tests/, notebooks/, prompts/ and config/ only
# through pull requests; frozen paths, raw data and the manifest need the frozen-override label.
on:
  push:
    branches: [post-submission]
  # pull_request_target runs this file as it is on the base branch, so a pull request cannot
  # edit the check that judges it; only base-branch code runs, the PR's commits are only diffed
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
  pull-requests: read
jobs:
  push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: commits pushed outside a merged pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          zero=0000000000000000000000000000000000000000
          if [ "$BEFORE" != "$zero" ] && ! git merge-base --is-ancestor "$BEFORE" "$AFTER"; then
            echo "::error::non-fast-forward push (history rewritten)"; exit 1
          fi
          # rules as they stood before this push, so a push cannot loosen its own check
          src=$([ "$BEFORE" = "$zero" ] && echo "$AFTER" || echo "$BEFORE")
          git show "$src:src/laf/path_guard.py" > "$RUNNER_TEMP/guard.py" 2>/dev/null \
            || cp src/laf/path_guard.py "$RUNNER_TEMP/guard.py"
          git show "$src:.github/frozen-paths.txt" > "$RUNNER_TEMP/frozen.txt" 2>/dev/null \
            || cp .github/frozen-paths.txt "$RUNNER_TEMP/frozen.txt"
          shas=$(git rev-list "$AFTER" --not "$BEFORE" 2>/dev/null || echo "$AFTER")
          direct=""
          for sha in $shas; do
            merged=$(gh api "repos/$REPO/commits/$sha/pulls" --jq 'map(select(.merged_at != null)) | length')
            if [ "$merged" = "0" ]; then direct="$direct $sha"; fi
          done
          python3 "$RUNNER_TEMP/guard.py" push --frozen "$RUNNER_TEMP/frozen.txt" $direct
  pull-request:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # the base branch: trusted rules and guard code
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: frozen paths, raw data and manifest
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'frozen-override') && '--override' || '' }}
        run: |
          # the PR's commits as objects only: never checked out, never executed
          git fetch --no-tags -q https://github.com/${{ github.repository }}.git "+refs/pull/$PR/head:refs/pr/head"
          [ "$(git rev-parse refs/pr/head)" = "$HEAD_SHA" ] || { echo "::error::PR head moved; re-run"; exit 1; }
          python3 src/laf/path_guard.py pr --frozen .github/frozen-paths.txt \
            "$(git merge-base HEAD "$HEAD_SHA")" "$HEAD_SHA" $OVERRIDE
