# Analyst settings of official legacy-ETAS products, inferred from their published MAPs on the
# as-of catalog (docs/adr/0010-etas-refit.md section 4.1; evidence in
# runs/etas_validation/20261021T1027Z/analyst_settings/). Not recorded by USGS anywhere.
#
# Used only by `laf etas --settings analyst`, a labelled sensitivity variant of the refit; the
# registered refit uses the code defaults. A rule applies to an issue whose matched official
# version has its window start in [from_days, to_days) days after the mainshock. Fields: regime
# (a Garcia regime name), time_dep_mc (default true), c_fixed (pins c with a one-point grid).

# Venezuela: regime overridden to SZ-GENERIC for the first month (the code assigns ANSR-ABSLSHC);
# later versions use the code's own regime.
[[rule]]
sequence = "us6000t7zp"
from_days = 0.0
to_days = 35.0
regime = "SZ-GENERIC"

# Colombia: settings changed from session to session; c pinned at 0.003 (days 1-8) and 0.1
# (days 35-42); regime per version chosen by distance to the published MAP (an identification,
# not a blind test).
[[rule]]
sequence = "us6000tjl2"
from_days = 0.0
to_days = 1.0
regime = "GLOBAL-AVERAGE"
time_dep_mc = false

[[rule]]
sequence = "us6000tjl2"
from_days = 1.0
to_days = 2.0
regime = "SZ-ONSHORE"
time_dep_mc = false
c_fixed = 0.003

[[rule]]
sequence = "us6000tjl2"
from_days = 2.0
to_days = 3.0
regime = "SZ-INLBACK"
c_fixed = 0.003

