# Confirmatory candidate set (docs/adr/0013-data-splits.md, decisions of 2026-10-30). It holds
# every event with an OAF product in data/raw/confirmatory/oaf_2024-01-01_2026-10-29.csv (the
# archive starts 2024-11-14) that is not development and not a foreshock or aftershock of a
# larger event. Development means the two sequence configs and the E1 outcome pool. The
