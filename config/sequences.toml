# Sequences and roles, assigned by outcome-blind rules (docs/adr/0006-dev-test-split.md) from
# the ComCat list of M>=7.0 earthquakes with origin 2025-07-01 to 2026-10-14
# (docs/research/data-availability.md section 2). Aftershocks/foreshocks of a listed mainshock
# (inside its circle within a year) are not separate sequences.
#   test-post  every M>=7.0 with origin 2026-07-01 .. 2026-10-14 (after the Claude cutoff month)
#   ambiguous  every M>=7.0 in the cutoff month (June 2026); secondary
#   test-pre   every M>=7.0 with origin 2025-07-01 .. 2026-05-31 that has an OAF product
#   dev        two pre-cutoff M>=7.0 events without OAF, for prompt iteration only; never scored
# Pre-cutoff M>=7.0 events without OAF and not in dev are not used (no official baseline).
# Do not change a role after the preregistration is frozen. catalog_min_mag is the ComCat
# query floor, not a scoring threshold.

[[sequence]]
