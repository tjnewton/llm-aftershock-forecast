[project]
name = "laf"
version = "0.1.0"
description = "Benchmark: calibration of LLM aftershock forecasts against USGS operational forecasts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
authors = [{ name = "Tyler Newton" }]
dependencies = [
    "anthropic>=1.15,<2",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "openai>=2,<3",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.8",
    "scipy>=1.14",
]

[project.scripts]
laf = "laf.cli:main"

[dependency-groups]
dev = [
    "adaption>=0.15.0",
    "altair>=6.3.0",
    "hypothesis>=6.100",
    "marimo>=0.25.2",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=3.7",
    "pyright>=1.1.380",
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["runs"]  # archived analysis scripts, kept as run
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "DTZ"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["network: hits the live USGS API (deselected by default in CI)"]
