# pre-commit and commit-msg hooks: `uv run pre-commit install` installs both (default_install_hook_types)
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest -q -m "not network"
        language: system
        pass_filenames: false
        always_run: true
      - id: no-secrets
        name: block .env and API keys
        entry: bash -c '! git diff --cached --name-only | grep -E "(^|/)\.env($|\.)" | grep -v ".env.example" && ! git diff --cached -U0 | grep -E "sk-ant-[A-Za-z0-9_-]{10,}"'
        language: system
        pass_filenames: false
        always_run: true
      - id: commit-identity
        name: author and committer are Tyler Newton (noreply email)
        entry: bash -c 'id="Tyler Newton <54011699+tjnewton@users.noreply.github.com>"; for v in GIT_AUTHOR_IDENT GIT_COMMITTER_IDENT; do case "$(git var $v)" in "$id "*) ;; *) echo "$v is $(git var $v), not $id"; exit 1;; esac; done'
        language: system
        pass_filenames: false
        always_run: true
      - id: no-commit-to-frozen-branch
        name: no commits on main or gh-pages
        entry: bash -c 'b=$(git symbolic-ref --short -q HEAD); case "$b" in main|gh-pages) echo "no commits on $b"; exit 1;; esac'
        language: system
        pass_filenames: false
        always_run: true
      - id: no-attribution
        name: no co-author or generated-with lines in the message
        entry: bash -c '! grep -qiE "^co-authored-by:|generated with" "$1"' --
        language: system
        stages: [commit-msg]
