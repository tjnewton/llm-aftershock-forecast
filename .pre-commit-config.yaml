# Guard hooks only (no code lives on this branch); same entries as on post-submission
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: no-secrets
        name: block .env and API keys
        entry: bash -c '! git diff --cached --name-only | grep -E "(^|/)\.env($|\.)" | grep -v ".env.example" && ! git diff --cached -U0 | grep -E "sk-ant-[A-Za-z0-9_-]{10,}"'
        language: system
        pass_filenames: false
        always_run: true
      - id: commit-identity
        name: author and committer are Tyler Newton (noreply email)
        entry: bash -c 'id="Tyler Newton <54011699+tjnewton@users.noreply.github.com>"; for v in GIT_AUTHOR_IDENT GIT_COMMITTER_IDENT; do case "$(git var $v)" in "$id "*) ;; *) echo "$v is $(git var $v), not $id"; exit 1;; esac; done'
        language: system
        pass_filenames: false
        always_run: true
      - id: no-attribution
        name: no co-author or generated-with lines in the message
        entry: bash -c '! grep -qiE "^co-authored-by:|generated with" "$1"' --
        language: system
        stages: [commit-msg]
